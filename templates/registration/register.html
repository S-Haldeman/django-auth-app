<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 36px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
        h2 { font-size: 22px; color: #1a1a1a; margin-bottom: 20px; text-align: center; }
        .field-wrapper { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #2563eb; }
        .helptext { display: none; } /* hides lengthy default requirements */
        .errorlist { color: #dc2626; font-size: 12px; margin-top: 4px; list-style: none; }
        .btn { width: 100%; padding: 10px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: #1d4ed8; }
        .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
        .footer-links a { color: #2563eb; text-decoration: none; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create an Account</h2>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field-wrapper">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <ul class="errorlist">
                            {% for error in field.errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="{% url 'login' %}">Log In</a><br><br>
            <a href="{% url 'home' %}">← Back to Home</a>
        </div>
    </div>
</body>
</html>
