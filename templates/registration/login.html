<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 36px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
        h2 { font-size: 22px; color: #1a1a1a; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #2563eb; }
        .btn { width: 100%; padding: 10px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: #1d4ed8; }
        .footer-links { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
        .footer-links a { color: #2563eb; text-decoration: none; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }
        .errorlist { color: #dc2626; font-size: 13px; margin-bottom: 15px; list-style: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Log In</h2>

        {% if form.errors %}
            <p style="color: #dc2626; font-size: 13px; text-align: center; margin-bottom: 12px;">Invalid username or password.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>

        <div class="footer-links">
            Don't have an account? <a href="{% url 'register' %}">Create one</a><br><br>
            <a href="{% url 'home' %}">← Back to Home</a>
        </div>
    </div>
</body>
</html>
