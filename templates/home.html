<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center; max-width: 440px; width: 100%; }
        h1 { font-size: 26px; color: #1a1a1a; margin-bottom: 12px; }
        p { color: #666; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 14px; cursor: pointer; transition: background 0.2s; border: none; }
        .btn-primary { background: #2563eb; color: #ffffff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #e5e7eb; color: #374151; margin-left: 8px; }
        .btn-secondary:hover { background: #d1d5db; }
        .btn-danger { background: #ef4444; color: #ffffff; margin-top: 10px; }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="card">
        {% if user.is_authenticated %}
            <h1>Welcome, {{ user.username }}!</h1>
            <p>You have successfully logged into your account.</p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Log Out</button>
            </form>
        {% else %}
            <h1>Welcome</h1>
            <p>Please log in or create a new account to continue.</p>
            <div>
                <a href="{% url 'login' %}" class="btn btn-primary">Log In</a>
                <a href="{% url 'register' %}" class="btn btn-secondary">Create Account</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
